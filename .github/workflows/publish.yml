name: Publish Hex package
run-name: Publish glammy ${{ inputs.version }} from ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed 40-character commit on main
        required: true
        type: string
      version:
        description: Stable SemVer that matches gleam.toml and annotated tag
        required: true
        type: string
      confirmation:
        description: Type "PUBLISH glammy X.Y.Z"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: glammy-hex-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify immutable handoff and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: hex-publish
    env:
      GLEAM_VERSION: "1.17.0"
      OTP_VERSION: "29"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release coordinates
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "commit must be a full lowercase 40-character SHA" >&2
            exit 1
          }
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "version must be a stable SemVer" >&2
            exit 1
          }
          test "$RELEASE_CONFIRMATION" = "PUBLISH glammy $RELEASE_VERSION"

          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --force --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$RELEASE_COMMIT"

          tag_ref="refs/tags/v$RELEASE_VERSION"
          git fetch --force origin "+$tag_ref:$tag_ref"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "$tag_ref^{}")" = "$RELEASE_COMMIT"

          manifest_name=$(sed -n 's/^name = "\([^"]*\)"$/\1/p' gleam.toml)
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' gleam.toml)
          test "$manifest_name" = glammy
          test "$manifest_version" = "$RELEASE_VERSION"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"

      - name: Verify pinned toolchain
        run: |
          set -euo pipefail
          test "$(gleam --version)" = "gleam $GLEAM_VERSION"
          otp_release=$(erl -noshell -eval \
            'io:format("~s", [erlang:system_info(otp_release)]), halt().')
          test "$otp_release" = "$OTP_VERSION"

      - name: Run release gates from the reviewed commit
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/telegram_bot_api_schema.py check
          gleam deps download
          git ls-files --error-unmatch manifest.toml
          test -z "$(git status --porcelain=v1 --untracked-files=all -- manifest.toml)"
          gleam build --warnings-as-errors
          gleam test
          gleam docs build
          gleam format --check src test examples/echo_bot/src
          git diff --check
          ./scripts/check_min_deps.sh

          (
            cd examples/echo_bot
            gleam deps download
            git ls-files --error-unmatch manifest.toml
            test -z "$(git status --porcelain=v1 --untracked-files=all -- manifest.toml)"
            gleam build --warnings-as-errors
          )

      - name: Export and verify pre-publish package twice
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          rm -f build/glammy-*.tar
          gleam export hex-tarball
          archive="build/glammy-$RELEASE_VERSION.tar"
          test -f "$archive"
          ./scripts/verify_hex_tarball.sh "$archive"
          GLAMMY_HEX_ARCHIVE=$archive \
            python3 scripts/tests/test_verify_hex_tarball.py

          handoff="$RUNNER_TEMP/glammy-publish-handoff"
          mkdir -p "$handoff"
          cp "$archive" "$handoff/prepublish-glammy-$RELEASE_VERSION.tar"
          gleam export hex-tarball
          ./scripts/compare_hex_artifacts.sh \
            "$handoff/prepublish-glammy-$RELEASE_VERSION.tar" \
            "$archive"
          ./scripts/build_hex_consumer.sh "$archive"

          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cd "$handoff"
          sha256sum "prepublish-glammy-$RELEASE_VERSION.tar" > SHA256SUMS
          artifact_sha=$(awk '{ print $1 }' SHA256SUMS)
          {
            printf '%s\n' "schema=glammy-publish-provenance-v1"
            printf '%s\n' "repository=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            printf '%s\n' "commit=$RELEASE_COMMIT"
            printf '%s\n' "tree=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})"
            printf '%s\n' "tag=v$RELEASE_VERSION"
            printf '%s\n' "version=$RELEASE_VERSION"
            printf '%s\n' "gleam=gleam $GLEAM_VERSION"
            printf '%s\n' "otp=$OTP_VERSION"
            printf '%s\n' "prepublish_sha256=$artifact_sha"
          } > PROVENANCE.txt

      - name: Upload immutable pre-publish evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glammy-prepublish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/glammy-publish-handoff
          if-no-files-found: error
          retention-days: 90

      - name: Publish reviewed commit to Hex
        id: hex_publish
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "${HEXPM_API_KEY:-}" =~ ^[0-9A-Fa-f]{32}$ ]] || {
            echo "HEXPM_API_KEY is missing or malformed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          gleam publish --yes

      - name: Capture published Hex archive and hash
        id: capture_published_archive
        if: always() && steps.hex_publish.outcome != 'skipped'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/glammy-publish-handoff"
          published="$handoff/published-glammy-$RELEASE_VERSION.tar"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://repo.hex.pm/tarballs/glammy-$RELEASE_VERSION.tar" \
            --output "$published"
          cd "$handoff"
          sha256sum "published-glammy-$RELEASE_VERSION.tar" >> SHA256SUMS

      - name: Capture published Hex release metadata
        id: capture_hex_release
        if: always() && steps.hex_publish.outcome != 'skipped'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/glammy-publish-handoff"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://hex.pm/api/packages/glammy/releases/$RELEASE_VERSION" \
            --output "$handoff/hex-release.json"

      - name: Capture published HexDocs
        id: capture_hexdocs
        if: always() && steps.hex_publish.outcome != 'skipped'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/glammy-publish-handoff"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://hexdocs.pm/glammy/$RELEASE_VERSION/" \
            --output "$handoff/hexdocs.html"

      - name: Verify published Hex artifact
        id: post_publish
        if: always() && steps.capture_published_archive.outcome == 'success'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/glammy-publish-handoff"
          published="$handoff/published-glammy-$RELEASE_VERSION.tar"
          ./scripts/verify_hex_tarball.sh "$published"
          ./scripts/compare_hex_artifacts.sh \
            "$handoff/prepublish-glammy-$RELEASE_VERSION.tar" \
            "$published"
          python3 - "$RELEASE_VERSION" "$handoff/hex-release.json" <<'PY'
          import json
          import sys

          expected_version = sys.argv[1]
          with open(sys.argv[2], encoding="utf-8") as release_file:
              release = json.load(release_file)
          if release.get("version") != expected_version:
              raise SystemExit("Hex API returned a different release version")
          if release.get("has_docs") is not True:
              raise SystemExit("Hex API has not confirmed versioned documentation")
          PY
          smoke_root="$RUNNER_TEMP/glammy_hex_smoke"
          gleam new --skip-git --skip-github "$smoke_root"
          (
            cd "$smoke_root"
            gleam add "glammy@$RELEASE_VERSION"
            gleam build --warnings-as-errors
          )

      - name: Finalize publish provenance
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.hex_publish.outcome }}
          ARCHIVE_CAPTURE_OUTCOME: ${{ steps.capture_published_archive.outcome }}
          RELEASE_CAPTURE_OUTCOME: ${{ steps.capture_hex_release.outcome }}
          HEXDOCS_CAPTURE_OUTCOME: ${{ steps.capture_hexdocs.outcome }}
          POST_PUBLISH_OUTCOME: ${{ steps.post_publish.outcome }}
        run: |
          handoff="$RUNNER_TEMP/glammy-publish-handoff"
          mkdir -p "$handoff"
          {
            printf '%s\n' "publish_outcome=$PUBLISH_OUTCOME"
            printf '%s\n' "archive_capture_outcome=$ARCHIVE_CAPTURE_OUTCOME"
            printf '%s\n' "release_capture_outcome=$RELEASE_CAPTURE_OUTCOME"
            printf '%s\n' "hexdocs_capture_outcome=$HEXDOCS_CAPTURE_OUTCOME"
            printf '%s\n' "post_publish_outcome=$POST_PUBLISH_OUTCOME"
          } >> "$handoff/PROVENANCE.txt"

      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glammy-publish-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/glammy-publish-handoff
          if-no-files-found: error
          retention-days: 90
